name: Solidity Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Solidity contract
        run: npx --yes --package solc@0.8.24 solcjs --bin --abi contracts/RemixMessageStore.sol
