<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Business Website</title>
    <meta
      name="description"
      content="Official business website with services, contact details, and updates."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://luis200412.github.io/LICENSE/" />
    <meta property="og:title" content="Business Website" />
    <meta
      property="og:description"
      content="Official business website with services, contact details, and updates."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luis200412.github.io/LICENSE/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Your Business Name",
        "url": "https://luis200412.github.io/LICENSE/",
        "description": "Official business website with services, contact details, and updates.",
        "email": "you@example.com"
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        line-height: 1.5;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1,
      h2 {
        line-height: 1.2;
      }
      .card {
        border: 1px solid #9aa0a6;
        border-radius: 10px;
        padding: 1rem;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your Business Name</h1>
      <p>
        Welcome to the official website. Update this page with your real business details so
        customers and search systems can find accurate information.
      </p>

      <section class="card">
        <h2>What We Do</h2>
        <p>Describe your services, products, and who you help.</p>
      </section>

      <section class="card">
        <h2>Contact</h2>
        <p>Email: <a href="mailto:you@example.com">you@example.com</a></p>
      </section>
    </main>
  </body>
</html>
